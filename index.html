<body>

  </section>

    <h2>Облако и коды</h2><p class="nt" id="cl"></p><input id="cdi" placeholder="Код переноса или промокод" maxlength="24"><button class="btn" id="cdb">Применить код</button><button class="btn s" id="cdm">Получить код переноса</button>
    <h2>Данные</h2><label>Резервная копия защитит прогресс, если браузер очистит данные сайта</label><br><button class="btn s" id="bk1">Скопировать код прогресса</button><button class="btn s" id="bk2">Восстановить по коду</button><br><button class="btn s" id="rst">Сбросить прогресс</button></div></section>
  <section id="acs" hidden><div class="top"><button class="btn s bk" id="acb"></button><b>Достижения: <span id="acn"></span></b></div><div class="stage"><div class="ach" id="acl"></div></div></section>
  <section id="fds" hidden><div class="top"><button class="btn s bk" id="fdb"></button><b id="fdt"></b></div><div class="cards" id="cards"></div></section>

    <div class="top"><button class="btn s bk" id="lbb"></button><b>Таблица лидеров</b></div>
    <div class="stage"><select id="lbg"></select><p id="lbn" class="hud"></p><table id="lbt" style="width:100%"></table></div>
  </section>
</main>
<dialog id="dl"><b>Аккаунт</b><p><input id="un" placeholder="Ник (3–16: буквы, цифры, _)" maxlength="16"><input id="pw" type="password" placeholder="Пароль (от 6 символов)"></p><p id="er" style="color:var(--r)"></p><button class="btn" id="li">Войти</button><button class="btn s" id="rg">Создать аккаунт</button><button class="btn s" id="cx">Отмена</button></dialog>
<dialog id="nd" style="width:min(92vw,420px)"><b style="font:800 16px var(--D)">Проверка связи</b><div id="nb" style="margin:12px 0"></div><button class="btn" id="ngo">Начать тест</button><button class="btn s" id="nx">Закрыть</button></dialog>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a))+a,now=()=>performance.now(),
avg=a=>a.reduce((x,y)=>x+y,0)/a.length,sh=a=>a.sort(()=>Math.random()-.5);
const rdk=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let S=rdk('reflex1');
if(!S){try{const raw=localStorage.getItem('reflex1');if(raw)localStorage.setItem('reflex1_corrupt',raw)}catch(e){}S=rdk('reflex1_bak')}
S=S||{xp:0,plays:0,streak:0,last:'',best:{}};
let lastBak=0,pushQ=()=>{};
const save=()=>{try{S.rev=(S.rev||0)+1;const j=JSON.stringify(S);localStorage.setItem('reflex1',j);if(Date.now()-lastBak>30000){localStorage.setItem('reflex1_bak',j);lastBak=Date.now()}if(S.user)pushQ()}catch(e){}};
const lvl=x=>Math.floor(Math.sqrt(x/40))+1,RK=['Новичок','Ученик','Боец','Мастер','Ниндзя','Легенда'];
// очистка таймеров и обработчиков игры
let cl=[];const clearAll=()=>{cl.forEach(f=>f());cl=[]};
const later=(f,ms)=>{const i=setTimeout(f,ms);cl.push(()=>clearTimeout(i))};
const every=(f,ms)=>{const i=setInterval(f,ms);cl.push(()=>clearInterval(i))};
const key=f=>{document.addEventListener('keydown',f);cl.push(()=>document.removeEventListener('keydown',f))};
const timer=(sec,out,done)=>{const o={t:sec};every(()=>{o.t-=.1;out.textContent=Math.max(0,o.t).toFixed(1);if(o.t<=0){clearAll();done()}},100);return o};
const mk=(p,tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls||'';if(txt!=null)e.textContent=txt;p.append(e);return e};
const ms=v=>Math.round(v)+' мс',pt=v=>v+' очк.',sc=v=>v.toFixed(1)+' с';
const pxp=(v,k)=>Math.max(5,Math.round((k-v)/(k>800?9:6)));

// общий шаблон: выбор из вариантов (Струп, стрелки)
function choice(el,end,N,btns,show,keys,dp){
  let n=0,err=0,rs=[],cur,t0;
  el.innerHTML=`<div class=hud>Раунд <b id=h>1</b>/${N} · ошибки <b id=e>0</b></div><div class=word id=w></div><div class=btns id=b></div>`;
  const w=$('#w'),B=$('#b');if(dp)B.className=dp==2?'btns k':'dpad';
  const next=()=>{w.style.animation='none';void w.offsetWidth;w.style.animation='';cur=show(w);t0=now()};
  const pick=i=>{if(dp){const x=B.children[i];x.classList.add('f');setTimeout(()=>x.classList.remove('f'),120)}rs.push(now()-t0);if(i!=cur){err++;$('#e').textContent=err;SFX.bad()}else SFX.hit();n++;
    if(n>=N){clearAll();const v=avg(rs)+err*400;end({val:v,xp:pxp(v,1400),txt:`Среднее: ${ms(avg(rs))}, ошибок: ${err}`})}
    else{$('#h').textContent=n+1;next()}};
  btns.forEach((t,i)=>{const b=mk(B,'button',dp==2?'kt':dp?'dp '+'ludr'[i]:'btn',t);if(dp==2){b.style.background=C[i][1];b.innerHTML=SH(i)}else if(dp)b.innerHTML=arr(i,40);b.onpointerdown=e=>{e.preventDefault();pick(i)}});
  if(keys)key(ev=>{const i=keys.indexOf(ev.key);if(i>-1){ev.preventDefault();pick(i)}});
  later(next,500);
}
const C=[['Красный','#ff5d5d'],['Синий','#4cc9f0'],['Зелёный','#3ddc84'],['Жёлтый','#ffb703']];

const G=[
{id:'light',ic:'🚦',n:'Светофор',d:'Жди зелёного и жми как можно быстрее. 5 раундов.',f:ms,low:1,dif:['Ожидание 1–2,5 с','Ожидание 1,2–3,6 с','Ожидание 0,8–5 с, момент трудно угадать'],
 run(el,end,D){const W=[[1000,2500],[1200,3600],[800,5000]][D];let n=0,rs=[],st='idle',t0;el.innerHTML='<div class=pad id=p>Нажми, чтобы начать</div>';const p=$('#p');
  const nx=()=>{st='wait';p.className='pad wait';p.textContent='Жди зелёного…';later(()=>{st='go';p.className='pad go';p.textContent='ЖМИ!';t0=now();SFX.go()},rnd(W[0],W[1]))};
  p.onpointerdown=()=>{
   if(st=='idle'||st=='res')nx();
   else if(st=='wait'){clearAll();SFX.bad();st='res';p.className='pad bad';p.textContent='Рано! Нажми, чтобы повторить'}
   else if(st=='go'){const d=now()-t0;rs.push(d);n++;SFX.hit();
    if(n>=5){const a=avg(rs);end({val:a,xp:pxp(a,600),txt:'Раунды: '+rs.map(x=>Math.round(x)).join(', ')+' мс'})}
    else{st='res';p.className='pad';p.textContent=ms(d)+' · дальше ('+n+'/5)'}}}}},
{id:'target',ic:'🎯',n:'Мишени',d:'Попади в 15 целей. После попадания видно время реакции.',f:ms,low:1,dif:['Крупные мишени','Обычные мишени','Мелкие мишени'],
 run(el,end,D){const Z=[84,72,54][D];let n=0,rs=[],t0;el.innerHTML='<div class=hud>Цель <b id=h>0</b>/15</div><div class=arena id=A></div>';const A=$('#A');
  const sp=()=>{A.querySelectorAll('.tg').forEach(x=>x.remove());const b=mk(A,'button','tg');b.style.width=b.style.height=Z+'px';b.style.left=rnd(0,A.clientWidth-Z)+'px';b.style.top=rnd(0,A.clientHeight-Z)+'px';
   b.onpointerdown=e=>{e.stopPropagation();const d=now()-t0;rs.push(d);n++;$('#h').textContent=n;SFX.hit();b.classList.add('hit');
   const l=mk(A,'b','pt',Math.round(d)+' мс');l.style.left=(b.offsetLeft+(Z-72)/2)+'px';l.style.top=(b.offsetTop+Z/2-10)+'px';setTimeout(()=>l.remove(),700);
   if(n>=15){const m=avg(rs);later(()=>end({val:m,xp:pxp(m,900),txt:'Среднее на цель: '+ms(m)}),650)}else later(sp,350)};t0=now()};
  later(sp,500)}},
{id:'stroop',ic:'🎨',n:'Цвета',d:'Нажми квадрат того цвета, в который окрашено слово (а не того, что написано).',f:ms,low:1,dif:['8 раундов, цвет часто совпадает со словом','10 раундов','14 раундов'],
 run(el,end,D){choice(el,end,[8,10,14][D],C.map(c=>c[0]),w=>{const a=rnd(0,4),b=Math.random()<[.5,0,0][D]?a:(a+1+rnd(0,3))%4;w.textContent=C[a][0];w.style.color=C[b][1];return b},['1','2','3','4'],2)}},
{id:'odd',ic:'🔍',n:'Оттенки',d:'Найди плитку другого оттенка. Ошибка отнимает секунды.',f:pt,dif:['40 секунд, поле до 5×5, заметная разница','30 секунд, поле до 6×6','25 секунд, поле до 7×7, тонкая разница'],
 run(el,end,D){let s=0;const TT=[40,30,25][D];el.innerHTML=`<div class=hud>Время <b id=tm>${TT}.0</b> · очки <b id=sc>0</b></div><div class=grid id=gr></div>`;const gr=$('#gr');
  const T=timer(TT,$('#tm'),()=>end({val:s,xp:s*6,txt:'Найдено: '+s}));
  const rd=()=>{const z=Math.min([5,6,7][D],[3,3,4][D]+Math.floor(s/5)),h=rnd(0,360),d=Math.max([9,6,4][D],[28,22,16][D]-s*[.5,.7,.9][D]),o=rnd(0,z*z);gr.style.gridTemplateColumns=`repeat(${z},1fr)`;gr.innerHTML='';
   for(let i=0;i<z*z;i++){const b=mk(gr,'button');b.style.background=`hsl(${h} 65% ${i==o?50+d:50}%)`;b.onpointerdown=()=>{if(i==o){s++;SFX.hit();$('#sc').textContent=s;rd()}else{T.t-=[1,2,2][D];SFX.bad()}}}};rd()}},
{id:'mole',ic:'🔨',n:'Кроты',d:'Бей кротов, пока они не спрятались. 25 секунд, с каждым попаданием они появляются всё быстрее.',f:pt,dif:['Кроты задерживаются дольше','Стандартная скорость','Кроты быстрые и появляются часто'],
 run(el,end,D){const P=[[1600,1000,1100,600],[1300,750,850,400],[1000,550,700,330]][D];let s=0;el.innerHTML='<div class=hud>Время <b id=tm>25.0</b> · очки <b id=sc>0</b></div><div class=grid id=gr style="grid-template-columns:repeat(3,1fr);gap:14px"></div>';
  const H=[...Array(9)].map(()=>mk($('#gr'),'button','hole'));
  H.forEach(h=>h.onpointerdown=()=>{if(h.classList.contains('on')){h.k++;SFX.hit();h.classList.remove('on','out');h.classList.add('hit');setTimeout(()=>h.classList.remove('hit'),300);s++;$('#sc').textContent=s}});
  timer(25,$('#tm'),()=>end({val:s,xp:s*5,txt:'Поймано кротов: '+s}));
  const sp=()=>{const f=H.filter(x=>!x.classList.contains('on')&&!x.classList.contains('hit'));
   if(f.length){const h=f[rnd(0,f.length)],L=Math.max(P[1],P[0]-s*12),k=h.k=(h.k||0)+1;h.classList.add('on');later(()=>h.k==k&&h.classList.add('out'),L-250);later(()=>h.k==k&&h.classList.remove('on','out'),L)}
   later(sp,Math.max(P[3],P[2]-s*10))};later(sp,300)}},
{id:'arrow',ic:'⬅️',n:'Стрелки',d:'Нажимай стрелку на клавиатуре или кнопку, соответствующую показанной.',f:ms,low:1,dif:['10 раундов','15 раундов','20 раундов'],
 run(el,end,D){choice(el,end,[10,15,20][D],['←','↑','↓','→'],w=>{const a=rnd(0,4);w.style.color='#f2efe6';w.innerHTML=arr(a,96);return a},['ArrowLeft','ArrowUp','ArrowDown','ArrowRight'],1)}},
{id:'gonogo',ic:'🟢',n:'Круги',d:'Жми зелёные круги, обходи красные (−2 очка). 20 секунд.',f:pt,dif:['Круги живут 2 с, красных мало','Круги живут 1,6 с','Круги живут 1,1 с, красных много'],
 run(el,end,D){let s=0;el.innerHTML='<div class=hud>Время <b id=tm>20.0</b> · очки <b id=sc>0</b></div><div class=arena id=A></div>';const A=$('#A');
  const up=d=>{s=Math.max(0,s+d);$('#sc').textContent=s};
  timer(20,$('#tm'),()=>end({val:s,xp:s*5,txt:'Очки: '+s}));
  every(()=>{const g=Math.random()<[.8,.7,.6][D],L=[2000,1600,1100][D],b=mk(A,'button','dot');b.style.background=g?'var(--g)':'var(--r)';
   b.style.left=rnd(0,A.clientWidth-56)+'px';b.style.top=rnd(0,A.clientHeight-56)+'px';
   b.style.setProperty('--life',L+'ms');b.onpointerdown=()=>{up(g?1:-2);g?SFX.hit():SFX.bad();b.classList.add('hit');setTimeout(()=>b.remove(),250)};later(()=>b.remove(),L)},[950,800,600][D])}},
{id:'nums',ic:'🔢',n:'Числа',d:'Нажми числа по возрастанию как можно быстрее. Ошибка: +1 с.',f:sc,low:1,dif:['Числа 1–9','Числа 1–16','Числа 1–25'],
 run(el,end,D){const K=[3,4,5][D],N=K*K;let n=1,t=0;el.innerHTML=`<div class=hud>Время <b id=tm>0.0</b> · ищи: <b id=nx>1</b></div><div class=grid id=gr style="grid-template-columns:repeat(${K},1fr)"></div>`;
  every(()=>{t+=.1;$('#tm').textContent=t.toFixed(1)},100);
  sh([...Array(N)].map((_,i)=>i+1)).forEach((v,j)=>{const b=mk($('#gr'),'button','',v);b.style.setProperty('--i',j);
   b.onpointerdown=()=>{if(v==n){b.className='ok';n++;SFX.pop();if(n>N){clearAll();$('#nx').textContent='✔';$('#tm').textContent=t.toFixed(1);$('#gr').classList.add('done');const T=t;setTimeout(()=>end({val:T,xp:Math.max(5,Math.round((N*4-T)*2)),txt:'Время: '+sc(T)}),1100)}else $('#nx').textContent=n}else{t+=1;SFX.bad();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),200)}}})}}
];

const RANKS=[[1,'Новичок'],[3,'Ученик'],[5,'Боец'],[7,'Охотник'],[10,'Мастер'],[13,'Ниндзя'],[17,'Гроссмейстер'],[22,'Легенда'],[30,'Бог реакции']];
const rank=L=>RANKS.filter(r=>L>=r[0]).pop()[1],xr=L=>[40*(L-1)**2,40*L*L];
const TH=[['Золото','#ffb703',1],['Бирюза','#2ec4b6',3],['Малина','#ff4d8d',5,'#cfeaff'],['Неон','#9bf542',0,'','fast'],['Фиолет','#a78bfa',12],['Лёд','#4cc9f0',16],
['Коралл','#ff7a59',2,'#cfeaff'],['Изумруд','#34d399',4],['Океан','#4da3ff',6],['Мандарин','#fb923c',0,'','s7'],['Сакура','#f4a9d0',0,'','col'],['Индиго','#8b8dff',0,'','hardall'],['Роза','#ff5c7a',0,'#cfeaff','star2all'],['Платина','#d5dde8',0,'','x5'],['Лава','#ff4d4d',0,'#cfeaff','tri']];
const thOk=x=>x[4]?!!S.ach2[x[4]]:lvl(S.xp)>=x[2],thTxt=x=>x[4]?'достижение «'+AC.find(a=>a[0]==x[4])[2]+'»':'с '+x[2]+' ур.';
const THS=[...TH].sort((a,b)=>a[2]-b[2]);
const applyTh=()=>{let x=TH[S.theme||0];if(!x||!thOk(x))x=TH[0];const s=document.documentElement.style;s.setProperty('--a',x[1]);s.setProperty('--gl',x[3]||x[1])};
const ms2=()=>S.maxStreak||S.streak;
// [id, иконка, название, описание, текущее значение, цель, награда XP]
const AC=[['p1','target','Первый шаг','Сыграй 1 раз',()=>S.plays,1,30],['p10','nums','Разогрев','Сыграй 10 раз',()=>S.plays,10,50],
['p50','trophy','Ветеран','Сыграй 50 раз',()=>S.plays,50,150],['p200','gem','Легенда зала','Сыграй 200 раз',()=>S.plays,200,400],
['all','star','Универсал','Попробуй все 8 игр',()=>G.filter(g=>S.best[g.id]!=null).length,8,100],['spec','mole','Специалист','10 раз сыграй в одну игру',()=>Math.max(0,...Object.values(S.pg)),10,80],
['s3','flame','Горячая серия','3 дня подряд',ms2,3,60],['s7','flame','Неделя огня','7 дней подряд',ms2,7,150],['s30','flame','Железная воля','30 дней подряд',ms2,30,500],
['fast','bolt','Молния','Светофор быстрее 340 мс',()=>+(S.best.light<340),1,100],['fast2','bolt','Быстрее света','Светофор быстрее 300 мс',()=>+(S.best.light<300),1,250],
['snip','target','Снайпер','Мишени быстрее 450 мс',()=>+(S.best.target<450),1,120],['col','stroop','Колорист','Цвета быстрее 900 мс',()=>+(S.best.stroop<900),1,120],
['eye','odd','Орлиный глаз','Оттенки: 12 очков',()=>S.best.odd||0,12,120],['hunt','mole','Охотник','Кроты: 33 очка',()=>S.best.mole||0,33,150],
['cat','arrow','Рефлексы кота','Стрелки быстрее 600 мс',()=>+(S.best.arrow<600),1,120],['calm','gonogo','Хладнокровие','Круги: 14 очков',()=>S.best.gonogo||0,14,120],
['cnt','nums','Скоростной счёт','Числа быстрее 25 с',()=>+(S.best.nums<25),1,120],['rec','trophy','Рекордсмен','Побей рекорды 10 раз',()=>S.recs||0,10,150],
['l5','star','Уровень 5','Достигни 5 уровня',()=>lvl(S.xp),5,100],['l10','star','Уровень 10','Достигни 10 уровня',()=>lvl(S.xp),10,300],
['x5','gem','Копилка','Набери 5000 XP',()=>S.xp,5000,0],['q10','medal','Квестер','Выполни 10 заданий дня',()=>S.qd||0,10,200],
['ms3','star','Три звезды','Получи 3 звезды в одной игре',()=>Math.max(...G.map(g=>stars(g.id))),3,150],['ms12','star','Мастер зала','Собери 12 звёзд мастерства',()=>G.reduce((s,g)=>s+stars(g.id),0),12,300],
['dod','bolt','Игра дня','Сыграй в игру дня 5 раз',()=>S.dod||0,5,120],['chest','gem','Кладоискатель','Открой 7 сундуков дня',()=>S.chests||0,7,150],

function sett(){show('sts');mu();$('#cl').textContent=!ON()?'Облако не подключено (нужен заполненный config.js).':S.user?'Аккаунт «'+S.user.name+'»: прогресс сохраняется в облаке автоматически.':'Войди в аккаунт, и прогресс будет храниться в облаке. Или перенеси его кодом.';$('#nsum').innerHTML=S.net?netRes(S.net):'<p class=nt>Тест ещё не проходился.</p>';const L=lvl(S.xp);$('#vo').value=Math.round((S.vol==null?1:S.vol)*100);
 $('#prt').innerHTML=TH.map((x,i)=>[x,i]).sort((a,b)=>(a[0][4]?100:a[0][2])-(b[0][4]?100:b[0][2])).map(([x,i])=>`<button class="sw ${(S.theme||0)==i?'on':''}" ${thOk(x)?'':'disabled'} data-i=${i} style="--sc:${x[1]}"><i></i>${x[0]}<small>${thOk(x)?'':thTxt(x)}</small></button>`).join('');
 $('#prt').onclick=e=>{const b=e.target.closest('.sw');if(b&&!b.disabled){S.theme=+b.dataset.i;save();applyTh();sett()}}}
function open(g){show('game');$('#gt').textContent=g.n;S.dif=S.dif||{};let D=S.dif[g.id]==null?1:S.dif[g.id];
 const st=$('#stage'),DN=['Лёгкий','Нормальный','Сложный'],DM=[.7,1,1.5],TC=['#3ddc84','var(--a)','#ff5d5d'],kk=d=>g.id+(d==1?'':d?'_h':'_e');
 st.innerHTML=`<div class=res><span class="ic lg" style="--h:${HU[g.id]}">${ico(g.id,42)}</span><p>${g.d}</p><div class=sw3 id=sw3><i class=th></i>${DN.map(x=>`<span>${x}</span>`).join('')}</div><p class=nt id=dn></p><button class="btn" id=go>Старт</button></div>`;
 const sw=$('#sw3'),upd=()=>{sw.style.setProperty('--d',D);sw.style.setProperty('--tc',TC[D]);sw.querySelectorAll('span').forEach((b,i)=>b.classList.toggle('on',i==D));$('#dn').textContent=g.dif[D]+' · ×'+DM[D]+' XP · рекорд: '+(S.best[kk(D)]!=null?g.f(S.best[kk(D)]):'—')};upd();
 const pk=e=>{const r=sw.getBoundingClientRect(),i=Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/r.width*3)));if(i!=D){D=i;S.dif[g.id]=D;save();upd();SFX.pop()}};
 sw.onpointerdown=e=>{sw.setPointerCapture(e.pointerId);pk(e)};sw.onpointermove=e=>{if(e.buttons)pk(e)};
 $('#go').onclick=()=>{st.innerHTML='';g.run(st,r=>fin(g,r,D),D)}}
function fin(g,r,D=1){clearAll();const key=g.id+(D==1?'':D?'_h':'_e'),pv=S.best[key],rec=pv==null||(g.low?r.val<pv:r.val>pv);if(rec){S.best[key]=r.val;if(D>0)S.recs=(S.recs||0)+1;if(D==2)S.hrecs=(S.hrecs||0)+1}if(D==2)S.hd=(S.hd||0)+1;
 const L0=lvl(S.xp),ex=[],st0=stars(g.id),k=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(S.last!=k){S.streak=S.last==y?S.streak+1:1;S.last=k}S.maxStreak=Math.max(S.maxStreak||0,S.streak);
 const isD=dod().id==g.id,sb=Math.min(50,S.streak*5),gain=Math.round((r.xp*(isD?2:1)+(rec?r.xp*.25:0))*(1+sb/100)*[.7,1,1.5][D]);
 S.xp+=gain;S.plays++;S.pg[g.id]=(S.pg[g.id]||0)+1;if(isD)S.dod=(S.dod||0)+1;
 if(stars(g.id)>st0){S.xp+=50;ex.push(['star','Звезда мастерства: '+g.n+' · +50 XP'])}
 const d=dq();d.plays++;d.xp+=gain;d.g[g.id]=(d.g[g.id]||0)+1;if(rec)d.rec++;
 todayQ().forEach(i=>{const q=Q[i];if(!d.done[i]&&q[2](d)>=q[1]){d.done[i]=1;S.qd=(S.qd||0)+1;S.xp+=q[3];d.xp+=q[3];ex.push(['check','Задание: '+q[0]+' · +'+q[3]+' XP'])}});
 AC.forEach(a=>{if(!S.ach2[a[0]]&&a[4]()>=a[5]){S.ach2[a[0]]=1;S.xp+=a[6];ex.push([a[1],'Достижение: '+a[2]+(a[6]?' · +'+a[6]+' XP':'')]);TH.forEach(x=>{if(x[4]==a[0])ex.push(['star','Новый цвет интерфейса: '+x[0]])})}});
 const L1=lvl(S.xp),[lo,hi]=xr(L1);
 if(L1>L0){TH.forEach(x=>{if(x[2]>L0&&x[2]<=L1)ex.push(['star','Новый цвет интерфейса: '+x[0]])});if(rank(L1)!=rank(L0))ex.push(['medal','Новый ранг: '+rank(L1)])}
 save();head();L1>L0?SFX.lvl():rec?SFX.win():SFX.good();
 if(D==1&&S.user&&ON())api('rx_submit',{p_token:S.user.token,p_game:g.id,p_val:r.val,p_xp:Math.min(400,gain)}).catch(()=>{});
 $('#stage').innerHTML=`<div class=res><p>${g.n} · ${['Лёгкий','Нормальный','Сложный'][D]}</p><div class=big>${g.f(r.val)}</div><p>${r.txt||''}</p>
 ${rec?'<span class=tag>'+ico('trophy',16)+' Новый рекорд! +25% XP</span>':'<p>Рекорд: '+g.f(S.best[key])+'</p>'}
 <p><span class="tag x">+${gain} XP</span>${isD?'<span class="tag x">Игра дня ×2</span>':''}${sb?'<span class="tag x">Серия +'+sb+'%</span>':''}${L1>L0?'<span class="tag x">'+ico('up',14)+' Уровень '+L1+'!</span>':''}</p>
 <div class=bar style="max-width:320px;margin:10px auto"><i style="width:${(S.xp-lo)/(hi-lo)*100}%"></i></div><p>Ур. ${L1} · ${rank(L1)}</p>
 ${ex.map(e=>'<p class=ac>'+ico(e[0],18)+' '+e[1]+'</p>').join('')}
 <button class=btn id=ag>Ещё раз</button><button class="btn s" id=mn>В меню</button></div>`;
 $('#ag').onclick=()=>open(g);$('#mn').onclick=home}
$('#back').onclick=()=>curF?fold(curF):home();
$('#rst').onclick=()=>{if(confirm('Удалить весь прогресс?')){S={xp:0,plays:0,streak:0,last:'',best:{},ach2:{},pg:{},rev:S.rev||0,user:S.user};save();pushSave(true);applyTh();home()}};
document.querySelectorAll('.bk').forEach(b=>b.innerHTML=ico('back',18)+' В меню');const hh=()=>{const h=$('header');document.documentElement.style.setProperty('--hh',(getComputedStyle(h).position=='sticky'?h.offsetHeight:0)+'px')};hh();addEventListener('resize',hh);$('#si').innerHTML=ico('gear',18);$('#pi').innerHTML=ico('user',18);$('#ti').innerHTML=ico('trophy',18);mu();acc();$('#ai').innerHTML=ico('medal',18);$('#prb').onclick=$('#acb').onclick=$('#stb').onclick=$('#fdb').onclick=()=>home();$('#sb').onclick=$('#pst').onclick=sett;$('#pf').onclick=prof;$('#vo').oninput=e=>{S.vol=e.target.value/100;save()};$('#vo').onchange=()=>SFX.hit();$('#ab').onclick=achs;const fixS=()=>{S.ach2=S.ach2||{};S.pg=S.pg||{};S.best=S.best||{}};
const sync=()=>{const o=rdk('reflex1');if(o&&(o.rev||0)>(S.rev||0)){S=o;fixS();head();if(!$('#home').hidden)home()}};
addEventListener('storage',e=>{if(e.key=='reflex1')sync()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});addEventListener('focus',sync);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const expS=()=>{const o={...S};delete o.user;return btoa(unescape(encodeURIComponent(JSON.stringify(o))))};
$('#bk1').onclick=()=>{const c=expS();(navigator.clipboard?navigator.clipboard.writeText(c).then(()=>toast('Код прогресса скопирован')):Promise.reject()).catch(()=>prompt('Скопируй код прогресса и сохрани его:',c))};
$('#bk2').onclick=()=>{const c=prompt('Вставь код прогресса:');if(!c)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(typeof o.xp!='number'||!o.best)throw 0;o.user=S.user;o.rev=Math.max(o.rev||0,S.rev||0)+1;S=o;fixS();save();applyTh();head();sett();toast('Прогресс восстановлен')}catch(e){toast('Не удалось прочитать код')}};
const clean=()=>{const o={...S};delete o.user;return o};
let pTm=0;pushQ=()=>{clearTimeout(pTm);pTm=setTimeout(()=>pushSave(false),4000)};
async function pushSave(force){if(!S.user||!ON())return;try{const r=await api('rx_save',{p_token:S.user.token,p_data:clean(),p_force:!!force});if(r&&r.conflict)adopt(r.data,'Найден более новый прогресс в облаке')}catch(e){}}
function adopt(d,msg){const u=S.user,rev=Math.max(d.rev||0,S.rev||0)+1;S={...d,user:u};fixS();S.rev=rev;try{localStorage.setItem('reflex1',JSON.stringify(S))}catch(e){}applyTh();head();if(!$('#home').hidden)home();toast(msg)}
async function pullSave(){if(!S.user||!ON())return;try{const d=await api('rx_load',{p_token:S.user.token});if(d&&(d.plays||0)>(S.plays||0))adopt(d,'Прогресс загружен из облака');else await pushSave(false)}catch(e){}}
$('#cdm').onclick=async()=>{if(!ON())return toast('Сервер не подключён');try{const c=await api('rx_code_make',{p_data:clean()});$('#cl').innerHTML='Твой код: <b>'+esc(c)+'</b> · действует 30 минут, один раз. Введи его на другом устройстве в этом же поле.';try{navigator.clipboard.writeText(c)}catch(e){}toast('Код создан')}catch(e){toast(e.message)}};
$('#cdb').onclick=async()=>{const c=$('#cdi').value.trim();if(!c)return;if(!ON())return toast('Сервер не подключён');
 try{const r=await api('rx_code_use',{p_code:c,p_token:S.user?S.user.token:null});
  if(r.type=='save'){if(confirm('Заменить текущий прогресс прогрессом из кода?')){adopt(r.data,'Прогресс загружен по коду');save();pushSave(true)}}
  else{const L0=lvl(S.xp);S.xp+=r.xp;save();head();SFX.win();toast('Промокод: +'+r.xp+' XP'+(lvl(S.xp)>L0?' · новый уровень!':''))}
  $('#cdi').value=''}catch(e){toast(e.message)}};
applyTh();$('#ngo').onclick=runNet;$('#ntb').onclick=openNet;$('#nx').onclick=()=>{S.nskip=1;save();$('#nd').close()};home();pullSave();if(!S.net&&!S.nskip)setTimeout(openNet,600);
</script>
